name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install dependencies (CPU-only torch, pinned versions)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt -c constraints.txt
          pip install ruff pytest pytest-asyncio
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest; the LLM is mocked, no Ollama needed)
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  setup-script:
    name: Windows setup script parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse setup.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          "setup.ps1 parsed with no errors"
