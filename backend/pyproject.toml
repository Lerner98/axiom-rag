[project]
name = "axiom-rag-backend"
version = "2.0.0"
description = "Axiom RAG backend: FastAPI + LangGraph pipeline over local documents"
requires-python = ">=3.11,<3.14"

# Dependencies live in requirements-app.txt (runtime), constraints.txt (pinned,
# tested versions) and requirements.txt (adds evaluation + dev tools).

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) plus the pycodestyle errors that catch bugs
# (E4 imports, E7 statements, E9 syntax). Style-only rules are left to review.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their public names.
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.warnings.PydanticDeprecatedSince20"]
